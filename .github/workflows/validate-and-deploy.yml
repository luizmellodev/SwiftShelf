name: Validate Snippets and Deploy

on:
  pull_request:
    paths:
      - "snippets/**"
  push:
    branches: [main]
    paths:
      - "snippets/**"

jobs:
  validate-snippets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ImageMagick and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

      - name: Auto-convert videos
        run: |
          echo "🎬 Converting videos automatically..."
          bash scripts/auto-convert-videos.sh

      - name: Commit converted videos
        if: github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add snippets/*/demo.mp4 snippets/*/meta.yml
          git diff --staged --quiet || git commit -m "chore: auto-convert videos to optimized format"
          git push
        continue-on-error: true

      - name: Validate snippets
        run: |
          echo "🔍 Running snippet validation..."
          npm run validate

      - name: Validate videos
        run: |
          echo "🎬 Running video validation..."
          node scripts/validate-videos.js
        continue-on-error: false

      - name: PR validation success
        if: github.event_name == 'pull_request'
        run: |
          echo "✅ All snippet validations passed!"
          echo "Your contribution looks good and will be automatically deployed when merged to main."

  validate-failed:
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: PR validation failed
        run: |
          echo "❌ Snippet validation failed."
          echo "Please check the workflow logs and fix the issues before this can be merged."

  deploy:
    needs: validate-snippets
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"
