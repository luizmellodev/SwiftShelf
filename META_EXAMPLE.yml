# ============================================
# COMO USAR:
# ============================================
# 1. Grave o vídeo do simulador iOS (⌘+R)
# 2. Copie para a pasta: cp ~/Desktop/recording.mov snippets/SEU-COMPONENTE/video.mov
# 3. Commit e push!
#
# O CI automaticamente:
# - Detecta o vídeo (sem precisar de flag no meta.yml!)
# - Converte para demo.mp4 otimizado
# - Remove o arquivo original
# - Faz commit no seu PR
#
# RESULTADO:
# - Na library: mostra screenshot, vídeo aparece no hover
# - Na página de detalhes: mostra vídeo automaticamente
