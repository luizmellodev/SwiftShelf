title: "Animated Like Button"
description: "A premium like button: keyframed squash-and-stretch, a shockwave ring with two-tone spark burst, rolling numeric count, soft deflate on unlike, and double-tap-to-like with a big heart popping over media. Ships heart, star and bookmark presets on the same engine, with haptics and VoiceOver support."
