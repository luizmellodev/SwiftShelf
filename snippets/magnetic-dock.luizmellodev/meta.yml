title: "Magnetic Dock"
description: "A glassy, finger-driven dock: icons swell on a smooth falloff as you slide, the dock stretches around your touch, a label bubble morphs between app names with haptic ticks, and lifting your finger launches the app with a classic bounce and running dot."
